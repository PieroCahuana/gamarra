<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puestos - Gamarra</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="usil.png" alt="Logo">
        <div class="brand-text">
          <h2>Gamarra</h2>
          <span>Gestión Municipal</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="puestos.html" class="active">🏪 Puestos</a>
        <a href="licencias.html">📄 Licencias</a>
        <a href="ambulantes.html">🧍 Ambulantes</a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-logout" onclick="logout()">Cerrar sesión</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>Puestos</h1>
          <p>Gestión de puestos registrados</p>
        </div>
      </div>

      <div class="page-header">
        <h2>Listado de Puestos</h2>
        <button class="btn btn-primary" onclick="abrirModal()">+ Nuevo puesto</button>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Galería</th>
                <th>Área (m²)</th>
                <th>Coordenadas</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="puestosTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="puestoModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo Puesto</h2>
      </div>
      <div class="modal-body">
        <form id="puestoForm">
          <input type="hidden" id="puestoId">

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Código</label>
              <input type="text" id="codigo" class="form-control" placeholder="Ej: GAL-A-001" required>
            </div>
            <div class="form-group">
              <label class="form-label">Galería</label>
              <input type="text" id="galeria" class="form-control" required>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Longitud</label>
              <input type="number" step="any" id="longitud" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Latitud</label>
              <input type="number" step="any" id="latitud" class="form-control" required>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Área (m²)</label>
              <input type="number" step="0.01" id="area_m2" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Estado</label>
              <select id="estado" class="form-control">
                <option value="disponible">Disponible</option>
                <option value="ocupado">Ocupado</option>
                <option value="inactivo">Inactivo</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarPuesto()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/puestos.js"></script>
</body>
</html>
